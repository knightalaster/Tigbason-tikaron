<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Tigbason Tikaron</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#101810;
    overflow:hidden;
    font-family:Arial, sans-serif;
    touch-action:none;
}

#game{
    display:block;
    width:100vw;
    height:100vh;
    image-rendering:pixelated;
}

/* UI */

#ui{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    pointer-events:none;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px #000;
    z-index:5;
}

#health{
    width:180px;
    height:18px;
    border:3px solid white;
    background:#333;
    margin-top:5px;
}

#healthBar{
    height:100%;
    width:100%;
    background:#e53935;
}

#ammo{
    margin-top:8px;
    font-size:18px;
}

#arenaText{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    white-space:nowrap;
}

/* Dialogue */

#dialogue{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:min(700px,92vw);
    min-height:125px;
    padding:18px;
    background:rgba(15,15,15,.94);
    border:3px solid white;
    border-radius:8px;
    color:white;
    z-index:20;
    display:none;
}

#speaker{
    color:#ffd54f;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

#dialogueText{
    font-size:17px;
    line-height:1.4;
}

#continue{
    position:absolute;
    right:15px;
    bottom:10px;
    font-size:12px;
    opacity:.7;
}

/* Mobile controls */

#controls{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:48px;
    height:48px;
    left:34px;
    top:34px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
}

#shoot{
    position:absolute;
    right:30px;
    bottom:38px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:rgba(220,50,50,.65);
    border:3px solid rgba(255,255,255,.7);
    color:white;
    font-weight:bold;
    pointer-events:auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Start screen */

#startScreen{
    position:fixed;
    inset:0;
    background:#101810;
    z-index:50;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

#startScreen h1{
    font-size:42px;
    color:#e8c76a;
    text-shadow:4px 4px #000;
}

#startScreen p{
    margin-top:10px;
    opacity:.8;
}

#startButton{
    margin-top:30px;
    padding:14px 35px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:7px;
    background:#e8c76a;
    color:#171717;
}

/* Game over */

#gameOver{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    background:rgba(0,0,0,.85);
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#gameOver h2{
    font-size:40px;
}

#restart{
    margin-top:20px;
    padding:12px 30px;
    font-size:18px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div id="arenaText">ARENA 1</div>

    <div>HP</div>
    <div id="health">
        <div id="healthBar"></div>
    </div>

    <div id="ammo">AMMO: 5 / 5</div>
</div>

<div id="dialogue">
    <div id="speaker">Sam</div>
    <div id="dialogueText"></div>
    <div id="continue">TAP / CLICK TO CONTINUE</div>
</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="shoot">SHOOT</div>
</div>

<div id="startScreen">
    <h1>TIGBASON TIKARON</h1>
    <p>A short adventure begins...</p>
    <button id="startButton">START GAME</button>
</div>

<div id="gameOver">
    <h2>SAM WAS DEFEATED</h2>
    <button id="restart">RESTART</button>
</div>

<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let gamePaused = false;
let dialogueActive = false;

let arena = 1;
let enemies = [];
let bullets = [];
let trees = [];

let keys = {};
let mouse = {
    x:0,
    y:0,
    down:false
};

let camera = {
    x:0,
    y:0
};


/* =========================================================
   PLAYER
========================================================= */

const player = {
    x:0,
    y:0,

    radius:16,

    speed:3.3,

    hp:100,
    maxHp:100,

    ammo:5,
    maxAmmo:5,

    reloading:false,
    reloadTime:2000,
    reloadStart:0,

    shootCooldown:180,
    lastShot:0
};


/* =========================================================
   WORLD
========================================================= */

const world = {
    width:1000,
    height:650
};


/* =========================================================
   START
========================================================= */

document.getElementById("startButton").onclick = () => {

    document.getElementById("startScreen").style.display = "none";

    gameStarted = true;

    startArena(1);

    requestAnimationFrame(gameLoop);
};


/* =========================================================
   INPUT
========================================================= */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if(e.key === " "){
        mouse.down = true;
    }

    if(dialogueActive){
        advanceDialogue();
    }
});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

    if(e.key === " "){
        mouse.down = false;
    }
});

canvas.addEventListener("mousemove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("mousedown", e => {

    mouse.down = true;
});

window.addEventListener("mouseup", () => {

    mouse.down = false;
});


/* =========================================================
   MOBILE SHOOT
========================================================= */

const shootButton = document.getElementById("shoot");

shootButton.addEventListener("touchstart", e => {

    e.preventDefault();

    mouse.down = true;

});

shootButton.addEventListener("touchend", e => {

    e.preventDefault();

    mouse.down = false;

});


/* =========================================================
   JOYSTICK
========================================================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

joystick.addEventListener("touchstart", e => {

    e.preventDefault();

    joystickActive = true;

});

joystick.addEventListener("touchmove", e => {

    e.preventDefault();

    if(!joystickActive) return;

    const touch = e.touches[0];

    const rect = joystick.getBoundingClientRect();

    let dx = touch.clientX - (rect.left + rect.width/2);
    let dy = touch.clientY - (rect.top + rect.height/2);

    const max = 42;

    const distance = Math.hypot(dx,dy);

    if(distance > max){

        dx = dx / distance * max;
        dy = dy / distance * max;

    }

    joystickX = dx / max;
    joystickY = dy / max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;

});

joystick.addEventListener("touchend", () => {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform = "translate(0,0)";
});


/* =========================================================
   DIALOGUE
========================================================= */

let dialogueLines = [];
let dialogueIndex = 0;

function startDialogue(lines, callback){

    dialogueLines = lines;
    dialogueIndex = 0;

    dialogueActive = true;

    document.getElementById("dialogue").style.display = "block";

    showDialogueLine();

    window.dialogueCallback = callback;
}

function showDialogueLine(){

    const line = dialogueLines[dialogueIndex];

    document.getElementById("speaker").textContent =
        line.speaker;

    document.getElementById("dialogueText").textContent =
        line.text;
}

function advanceDialogue(){

    if(!dialogueActive) return;

    dialogueIndex++;

    if(dialogueIndex >= dialogueLines.length){

        dialogueActive = false;

        document.getElementById("dialogue").style.display =
            "none";

        if(window.dialogueCallback){

            const callback = window.dialogueCallback;

            window.dialogueCallback = null;

            callback();
        }

        return;
    }

    showDialogueLine();
}

document.getElementById("dialogue").addEventListener(
    "click",
    advanceDialogue
);


/* =========================================================
   ARENA START
========================================================= */

function startArena(number){

    arena = number;

    document.getElementById("arenaText").textContent =
        "ARENA " + arena;

    enemies = [];
    bullets = [];
    trees = [];

    player.reloading = false;
    player.ammo = player.maxAmmo;

    player.x = 500;
    player.y = 560;

    createTrees();

    if(arena === 1){

        startDialogue([
            {
                speaker:"Sam",
                text:"Where am I...?"
            },
            {
                speaker:"Sam",
                text:"I need to find the treasure."
            }
        ], () => {

            spawnEnemies(3);

        });

    }

    else if(arena === 2){

        startDialogue([
            {
                speaker:"Sam",
                text:"There are more of them..."
            },
            {
                speaker:"Sam",
                text:"I better keep my distance."
            }
        ], () => {

            spawnEnemies(5);

        });

    }

    else if(arena === 3){

        startDialogue([
            {
                speaker:"Sam",
                text:"Something feels wrong..."
            },
            {
                speaker:"???",
                text:"Looking for something?"
            },
            {
                speaker:"Sam",
                text:"Who's there?"
            },
            {
                speaker:"Clark",
                text:"My name is Clark."
            }
        ], () => {

            clarkIntro();

        });

    }

    else if(arena === 4){

        startDialogue([
            {
                speaker:"Sam",
                text:"So he's still watching me..."
            },
            {
                speaker:"Sam",
                text:"I have to keep moving."
            }
        ], () => {

            spawnEnemies(7);

        });

    }

    else if(arena === 5){

        startDialogue([
            {
                speaker:"Clark",
                text:"You made it this far."
            },
            {
                speaker:"Sam",
                text:"I'm not stopping now."
            },
            {
                speaker:"Clark",
                text:"Then come and get your treasure."
            }
        ], () => {

            startClarkBoss();

        });

    }
}


/* =========================================================
   TREES
========================================================= */

function createTrees(){

    const positions = [

        [180,180],
        [350,150],
        [650,160],
        [820,220],

        [250,350],
        [500,320],
        [760,360],

        [170,500],
        [380,470],
        [650,500],
        [840,470]
    ];

    positions.forEach(pos => {

        trees.push({
            x:pos[0],
            y:pos[1],
            width:55,
            height:70
        });

    });
}


/* =========================================================
   ENEMIES
========================================================= */

function spawnEnemies(amount){

    for(let i=0;i<amount;i++){

        let x;
        let y;

        do{

            x = 150 + Math.random()*700;
            y = 100 + Math.random()*400;

        }while(Math.hypot(x-player.x,y-player.y)<170);

        enemies.push({

            x:x,
            y:y,

            radius:17,

            speed:1.15 + Math.random()*.25,

            hp:40,

            attackCooldown:600,

            lastAttack:0

        });
    }
}


/* =========================================================
   CLARK
========================================================= */

let clark = null;

function clarkIntro(){

    clark = {

        x:750,
        y:180,

        radius:22,

        hp:100,

        active:true,

        intro:true,

        lastAttack:0
    };

    /*
       Clark fires one warning shot,
       then leaves.
    */

    setTimeout(() => {

        if(clark){

            fireClarkBullet(
                player.x,
                player.y
            );
        }

    },700);

    setTimeout(() => {

        clark = null;

        spawnEnemies(6);

    },1800);
}


function startClarkBoss(){

    clark = {

        x:750,
        y:180,

        radius:28,

        hp:500,

        active:true,

        intro:false,

        lastAttack:0,

        pattern:0,

        patternTimer:0

    };

}


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(circle, rect){

    const closestX = Math.max(
        rect.x,
        Math.min(circle.x, rect.x + rect.width)
    );

    const closestY = Math.max(
        rect.y,
        Math.min(circle.y, rect.y + rect.height)
    );

    const dx = circle.x - closestX;
    const dy = circle.y - closestY;

    return dx*dx + dy*dy <
           circle.radius*circle.radius;
}


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(){

    if(dialogueActive) return;

    let dx = 0;
    let dy = 0;

    if(keys["w"] || keys["arrowup"]) dy -= 1;
    if(keys["s"] || keys["arrowdown"]) dy += 1;
    if(keys["a"] || keys["arrowleft"]) dx -= 1;
    if(keys["d"] || keys["arrowright"]) dx += 1;

    if(joystickActive){

        dx = joystickX;
        dy = joystickY;

    }

    const length = Math.hypot(dx,dy);

    if(length > 0){

        dx /= length;
        dy /= length;

    }

    const oldX = player.x;
    const oldY = player.y;

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    player.x = Math.max(
        player.radius,
        Math.min(world.width-player.radius,player.x)
    );

    player.y = Math.max(
        player.radius,
        Math.min(world.height-player.radius,player.y)
    );

    for(const tree of trees){

        if(circleRectCollision(player,tree)){

            player.x = oldX;
            player.y = oldY;

            break;
        }
    }
}


/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(dialogueActive) return;

    if(player.reloading) return;

    const now = Date.now();

    if(now-player.lastShot < player.shootCooldown)
        return;

    if(player.ammo <= 0){

        reload();

        return;
    }

    let targetX = mouse.x;
    let targetY = mouse.y;

    /*
       On mobile, shoot toward the closest enemy.
    */

    if(
        !mouse.x &&
        enemies.length
    ){

        let nearest = enemies[0];

        for(const enemy of enemies){

            if(
                Math.hypot(
                    enemy.x-player.x,
                    enemy.y-player.y
                )
                <
                Math.hypot(
                    nearest.x-player.x,
                    nearest.y-player.y
                )
            ){

                nearest = enemy;

            }
        }

        targetX = nearest.x;
        targetY = nearest.y;
    }

    /*
       Convert screen position into world position.
    */

    targetX += camera.x;
    targetY += camera.y;

    const angle = Math.atan2(
        targetY-player.y,
        targetX-player.x
    );

    bullets.push({

        x:player.x,
        y:player.y,

        vx:Math.cos(angle)*8,
        vy:Math.sin(angle)*8,

        radius:5,

        damage:20

    });

    player.ammo--;

    player.lastShot = now;

    if(player.ammo <= 0){

        reload();

    }
}


function reload(){

    if(player.reloading) return;

    player.reloading = true;

    player.reloadStart = Date.now();
}


function updateReload(){

    if(!player.reloading) return;

    if(Date.now()-player.reloadStart >= player.reloadTime){

        player.reloading = false;

        player.ammo = player.maxAmmo;

    }
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const bullet = bullets[i];

        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        let remove = false;

        for(const tree of trees){

            if(circleRectCollision(bullet,tree)){

                remove = true;
                break;

            }
        }

        if(
            bullet.x < 0 ||
            bullet.x > world.width ||
            bullet.y < 0 ||
            bullet.y > world.height
        ){

            remove = true;

        }

        for(let j=enemies.length-1;j>=0;j--){

            const enemy = enemies[j];

            const distance = Math.hypot(
                bullet.x-enemy.x,
                bullet.y-enemy.y
            );

            if(distance < bullet.radius+enemy.radius){

                enemy.hp -= bullet.damage;

                remove = true;

                if(enemy.hp <= 0){

                    enemies.splice(j,1);

                }

                break;
            }
        }

        if(clark && !clark.intro){

            const distance = Math.hypot(
                bullet.x-clark.x,
                bullet.y-clark.y
            );

            if(distance < bullet.radius+clark.radius){

                clark.hp -= bullet.damage;

                remove = true;

                if(clark.hp <= 0){

                    defeatClark();

                }
            }
        }

        if(remove){

            bullets.splice(i,1);

        }
    }
}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

    if(dialogueActive) return;

    for(const enemy of enemies){

        const dx = player.x-enemy.x;
        const dy = player.y-enemy.y;

        const distance = Math.hypot(dx,dy);

        if(distance > enemy.radius+player.radius+3){

            const oldX = enemy.x;
            const oldY = enemy.y;

            enemy.x += dx/distance*enemy.speed;
            enemy.y += dy/distance*enemy.speed;

            for(const tree of trees){

                if(circleRectCollision(enemy,tree)){

                    enemy.x = oldX;
                    enemy.y = oldY;

                    break;
                }
            }

        }
        else{

            const now = Date.now();

            if(
                now-enemy.lastAttack >
                enemy.attackCooldown
              ){

                damagePlayer(8);

                enemy.lastAttack = now;

            }
        }
    }
}


/* =========================================================
   CLARK ATTACKS
========================================================= */

function updateClark(){

    if(!clark || clark.intro || dialogueActive)
        return;

    const now = Date.now();

    if(now-clark.lastAttack > 1800){

        clark.lastAttack = now;

        clark.pattern =
            Math.floor(Math.random()*3);

        if(clark.pattern === 0){

            /*
                Triple aimed shot
            */

            for(let i=-1;i<=1;i++){

                const angle =
                    Math.atan2(
                        player.y-clark.y,
                        player.x-clark.x
                    ) + i*.15;

                bullets.push({

                    x:clark.x,
                    y:clark.y,

                    vx:Math.cos(angle)*4,
                    vy:Math.sin(angle)*4,

                    radius:7,

                    damage:12,

                    enemyBullet:true

                });
            }

        }

        else if(clark.pattern === 1){

            /*
                Spread attack
            */

            for(let i=0;i<8;i++){

                const angle =
                    Math.PI*2*i/8;

                bullets.push({

                    x:clark.x,
                    y:clark.y,

                    vx:Math.cos(angle)*3.5,
                    vy:Math.sin(angle)*3.5,

                    radius:7,

                    damage:10,

                    enemyBullet:true

                });
            }

        }

        else{

            /*
                Direct attack
            */

            fireClarkBullet(
                player.x,
                player.y
            );

        }
    }
}


function fireClarkBullet(targetX,targetY){

    const angle =
        Math.atan2(
            targetY-clark.y,
            targetX-clark.x
        );

    bullets.push({

        x:clark.x,
        y:clark.y,

        vx:Math.cos(angle)*4,
        vy:Math.sin(angle)*4,

        radius:7,

        damage:15,

        enemyBullet:true

    });
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

    if(dialogueActive) return;

    player.hp -= amount;

    if(player.hp <= 0){

        player.hp = 0;

        gameOver();

    }
}


/* =========================================================
   ENEMY BULLET DAMAGE
========================================================= */

function checkEnemyBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const bullet = bullets[i];

        if(!bullet.enemyBullet) continue;

        const distance = Math.hypot(
            bullet.x-player.x,
            bullet.y-player.y
        );

        if(distance <
           bullet.radius+player.radius){

            damagePlayer(bullet.damage);

            bullets.splice(i,1);

        }
    }
}


/* =========================================================
   ARENA CLEAR
========================================================= */

function checkArenaClear(){

    if(dialogueActive) return;

    /*
       Clark boss arena
    */

    if(arena === 5){

        if(!clark){

            finishGame();

        }

        return;
    }

    if(
        enemies.length === 0 &&
        !clark
    ){

        setTimeout(() => {

            if(
                arena < 5 &&
                enemies.length === 0
            ){

                startArena(arena+1);

            }

        },700);
    }
}


/* =========================================================
   CLARK DEFEATED
========================================================= */

function defeatClark(){

    clark = null;

    startDialogue([

        {
            speaker:"Sam",
            text:"It's over..."
        },
        {
            speaker:"Sam",
            text:"The treasure should be close."
        }

    ], () => {

        finishGame();

    });
}


/* =========================================================
   END
========================================================= */

function finishGame(){

    gamePaused = true;

    setTimeout(() => {

        alert(
            "TIGBASON TIKARON\n\n" +
            "Sam found the treasure."
        );

    },300);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    gamePaused = true;

    document.getElementById("gameOver")
        .style.display = "flex";
}

document.getElementById("restart").onclick = () => {

    location.reload();

};


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.x =
        player.x -
        canvas.width/2;

    camera.y =
        player.y -
        canvas.height/2;

    camera.x = Math.max(
        0,
        Math.min(
            world.width-canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            world.height-canvas.height,
            camera.y
        )
    );
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle = "#507447";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
       World floor
    */

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    ctx.fillStyle = "#5d854d";

    ctx.fillRect(
        0,
        0,
        world.width,
        world.height
    );

    /*
       Pathway
    */

    ctx.fillStyle = "#b69b6b";

    ctx.fillRect(
        430,
        550,
        140,
        100
    );

    /*
       Trees
    */

    for(const tree of trees){

        drawTree(tree);

    }

    ctx.restore();
}


/* =========================================================
   DRAW TREE
========================================================= */

function drawTree(tree){

    /*
       trunk
    */

    ctx.fillStyle = "#70462d";

    ctx.fillRect(
        tree.x+19,
        tree.y+35,
        17,
        35
    );

    /*
       leaves
    */

    ctx.fillStyle = "#193f24";

    ctx.beginPath();

    ctx.arc(
        tree.x+27,
        tree.y+27,
        28,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#285c31";

    ctx.beginPath();

    ctx.arc(
        tree.x+17,
        tree.y+15,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        tree.x+38,
        tree.y+14,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    ctx.save();

    ctx.translate(
        player.x-camera.x,
        player.y-camera.y
    );

    /*
       body
    */

    ctx.fillStyle = "#3b6ea8";

    ctx.fillRect(
        -13,
        -10,
        26,
        25
    );

    /*
       head
    */

    ctx.fillStyle = "#e6b48a";

    ctx.beginPath();

    ctx.arc(
        0,
        -18,
        11,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       weapon
    */

    let angle =
        Math.atan2(
            mouse.y-canvas.height/2,
            mouse.x-canvas.width/2
        );

    ctx.rotate(angle);

    ctx.fillStyle = "#222";

    ctx.fillRect(
        5,
        -4,
        30,
        7
    );

    ctx.restore();
}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies(){

    for(const enemy of enemies){

        ctx.save();

        ctx.translate(
            enemy.x-camera.x,
            enemy.y-camera.y
        );

        ctx.fillStyle = "#9e3131";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            enemy.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
           eyes
        */

        ctx.fillStyle = "white";

        ctx.fillRect(-8,-6,5,5);
        ctx.fillRect(3,-6,5,5);

        ctx.restore();
    }
}


/* =========================================================
   DRAW CLARK
========================================================= */

function drawClark(){

    if(!clark) return;

    ctx.save();

    ctx.translate(
        clark.x-camera.x,
        clark.y-camera.y
    );

    ctx.fillStyle = "#562c6e";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        clark.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#ffdb4d";

    ctx.fillRect(-9,-7,6,6);
    ctx.fillRect(4,-7,6,6);

    ctx.restore();
}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets(){

    for(const bullet of bullets){

        ctx.fillStyle =
            bullet.enemyBullet
            ? "#ff8a65"
            : "#fff176";

        ctx.beginPath();

        ctx.arc(
            bullet.x-camera.x,
            bullet.y-camera.y,
            bullet.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI(){

    document.getElementById("healthBar")
        .style.width =
        player.hp/player.maxHp*100 + "%";

    let ammoText =
        player.reloading
        ? "RELOADING..."
        : `AMMO: ${player.ammo} / ${player.maxAmmo}`;

    document.getElementById("ammo")
        .textContent = ammoText;
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    if(gameStarted && !gamePaused){

        movePlayer();

        updateReload();

        shoot();

        updateBullets();

        updateEnemies();

        updateClark();

        checkEnemyBullets();

        checkArenaClear();

        updateCamera();

        updateUI();

        drawWorld();

        drawBullets();

        drawEnemies();

        drawClark();

        drawPlayer();

    }

    requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
