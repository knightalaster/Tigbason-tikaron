/* =====================================================

let dialogueList =

let dialogueIndex =

let dialogueCallback =
    null;


/* =====================================================
   START DIALOGUE
===================================================== */

function startDialogue(
    list,
    callback
){

    dialogueList =
        list;

    dialogueIndex =
        0;

    dialogueCallback =
        callback || null;

    dialogueActive =
        true;

    gamePaused =
        true;

    dialogueScene.style.display =
        "flex";

    showDialogue();

}


/* =====================================================
   SHOW CURRENT DIALOGUE
===================================================== */

function showDialogue(){

    if(
        dialogueIndex >=
        dialogueList.length
    ){

        endDialogue();

        return;

    }


    const line =
        dialogueList[
            dialogueIndex
        ];


    speaker.textContent =
        line.speaker;


    dialogueText.textContent =
        line.text;


    const image =
        images[line.image];


    if(
        image &&
        image.complete &&
        image.naturalWidth > 0
    ){

        characterImage.src =
            image.src;

        characterImage.style.display =
            "block";

    }
    else{

        characterImage.removeAttribute(
            "src"
        );

        characterImage.style.display =
            "none";

    }

}


/* =====================================================
   NEXT DIALOGUE
===================================================== */

function nextDialogue(){

    if(
        !dialogueActive
    ){

        return;

    }


    dialogueIndex++;


    if(
        dialogueIndex >=
        dialogueList.length
    ){

        endDialogue();

    }
    else{

        showDialogue();

    }

}


/* =====================================================
   END DIALOGUE
===================================================== */

function endDialogue(){

    dialogueActive =
        false;

    dialogueScene.style.display =
        "none";

    gamePaused =
        false;


    if(
        dialogueCallback
    ){

        const callback =
            dialogueCallback;

        dialogueCallback =
            null;

        callback();

    }

}

        event.preventDefault();

        nextDialogue();

);

===================================================== */

function stopAllMusic(){

    normalMusic.pause();

    bossMusic.pause();

    phase2Music.pause();

    brentMusic.pause();

}


function playMusic(
    audio
){

    if(
        !musicEnabled
    ){

        return;

    }


    stopAllMusic();


    audio.currentTime =
        0;


    audio.play().catch(
        () => {}
    );

}


musicButton.addEventListener(
    "click",
    () => {

        musicEnabled =
            !musicEnabled;


        if(
            !musicEnabled
        ){

            stopAllMusic();

            musicButton.textContent =
                "🔇";

        }
        else{

            musicButton.textContent =
                "♫";


            if(
                phase2Active
            ){

                playMusic(
                    phase2Music
                );

            }
            else if(
                currentArena === 3

                    normalMusic

);

    /* =====================================================
   VIRTUAL JOYSTICK
===================================================== */

const joystickRadius =
    70;

const knobRadius =
    32;


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const maxDistance =
        joystickRadius -
        knobRadius;


    if(
        distance >
        maxDistance
    ){

        dx =
            dx /
            distance *
            maxDistance;

        dy =
            dy /
            distance *
            maxDistance;

    }


    joystickState.x =
        dx /
        maxDistance;


    joystickState.y =
        dy /
        maxDistance;


    joystickState.power =
        Math.min(
            distance /
            maxDistance,
            1
        );


    joystickKnob.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

}


/* =====================================================
   RESET JOYSTICK
===================================================== */

function resetJoystick(){

    joystickState.active =
        false;

    joystickState.pointerId =
        null;

    joystickState.x =
        0;

    joystickState.y =
        0;

    joystickState.power =
        0;


    joystickKnob.style.transform =
        "translate(-50%, -50%)";

}


/* =====================================================
   JOYSTICK POINTER DOWN
===================================================== */

joystick.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        joystickState.active =
            true;

        joystickState.pointerId =
            event.pointerId;


        joystick.setPointerCapture(
            event.pointerId
        );


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


/* =====================================================
   JOYSTICK POINTER MOVE
===================================================== */

joystick.addEventListener(
    "pointermove",
    event => {

        if(
            !joystickState.active
        ){

            return;

        }


        if(
            event.pointerId !==
            joystickState.pointerId
        ){

            return;

        }


        event.preventDefault();


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


/* =====================================================
   JOYSTICK RELEASE
===================================================== */

joystick.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        resetJoystick();

    }
);


joystick.addEventListener(
    "pointercancel",
    event => {

        event.preventDefault();

        resetJoystick();

    }
);

/* =====================================================
   GET MOVEMENT INPUT
===================================================== */

function getMovementInput(){

    let x =
        joystickState.x;

    let y =
        joystickState.y;


    /*
       Keyboard is also supported.
    */

    if(
        keyboard.left
    ){

        x -= 1;

    }


    if(
        keyboard.right
    ){

        x += 1;

    }


    if(
        keyboard.up
    ){

        y -= 1;

    }


    if(
        keyboard.down
    ){

        y += 1;

    }


    /*
       Normalize keyboard movement.
    */

    const length =
        Math.sqrt(
            x * x +
            y * y
        );


    if(
        length > 1
    ){

        x /=
            length;

        y /=
            length;

    }


    return {
        x,
        y
    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceBetween(
    a,
    b
){

    const dx =
        a.x -
        b.x;

    const dy =
        a.y -
        b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   ANGLE
===================================================== */

function angleBetween(
    a,
    b
){

    return Math.atan2(

        b.y -
        a.y,

        b.x -
        a.x

    );

}


/* =====================================================
   GET NEAREST TARGET
===================================================== */

function getNearestTarget(){

    let closest =
        null;

    let closestDistance =
        Infinity;


    /*
       Phase 2 / Clark.
    */

    if(
        clark &&
        !clark.dead
    ){

        const d =
            distanceBetween(
                player,
                clark
            );


        if(
            d <
            closestDistance
        ){

            closest =
                clark;

            closestDistance =
                d;

        }

    }


    /*
       Normal enemies.
    */

    for(
        const enemy of enemies
    ){

        if(
            enemy.dead
        ){

            continue;

        }


        const d =
            distanceBetween(
                player,
                enemy
            );


        if(
            d <
            closestDistance
        ){

            closest =
                enemy;

            closestDistance =
                d;

        }

    }


    return closest;

}


/* =====================================================
   AUTOMATIC AIM
===================================================== */

function getAimAngle(){

    const target =
        getNearestTarget();


    if(
        target
    ){

        return angleBetween(
            player,
            target
        );

    }


    return player.facing;

}


/* =====================================================
   SHOOT
===================================================== */

function tryShoot(){

    if(
        !gameStarted ||
        gamePaused ||
        playerDead
    ){

        return;

    }


    if(
        weapon.reloading
    ){

        return;

    }


    if(
        weapon.fireCooldown >
        0
    ){

        return;

    }


    if(
        weapon.ammo <= 0
    ){

        startReload();

        return;

    }


    const angle =
        getAimAngle();


    player.facing =
        angle;


    const bulletSpeed =
        10;


    bullets.push({

        x:
            player.x +
            Math.cos(angle) *
            25,

        y:
            player.y +
            Math.sin(angle) *
            25,

        vx:
            Math.cos(angle) *
            bulletSpeed,

        vy:
            Math.sin(angle) *
            bulletSpeed,

        radius:
            6,

        damage:
            20,

        life:
            100

    });


    weapon.ammo--;


    weapon.fireCooldown =
        weapon.fireDelay;


    createParticles(
        player.x +
        Math.cos(angle) *
        25,

        player.y +
        Math.sin(angle) *
        25,

        4
    );


    if(
        weapon.ammo <= 0
    ){

        startReload();

    }


    updateAmmoUI();

}


/* =====================================================
   RELOAD
===================================================== */

function startReload(){

    if(
        weapon.reloading
    ){

        return;

    }


    if(
        weapon.ammo >=
        weapon.maxAmmo
    ){

        return;

    }


    weapon.reloading =
        true;

    weapon.reloadTimer =
        weapon.reloadTime;


    updateAmmoUI();

}


/* =====================================================
   UPDATE RELOAD
===================================================== */

function updateReload(
    delta
){

    if(
        !weapon.reloading
    ){

        return;

    }


    weapon.reloadTimer -=
        delta;


    if(
        weapon.reloadTimer <=
        0
    ){

        weapon.reloadTimer =
            0;

        weapon.ammo =
            weapon.maxAmmo;

        weapon.reloading =
            false;

    }


    updateAmmoUI();

}


/* =====================================================
   MOVE PLAYER
===================================================== */

function movePlayer(
    delta
){

    if(
        gamePaused ||
        playerDead
    ){

        return;

    }


    const input =
        getMovementInput();


    const speed =
        player.speed *
        (delta / 16.67);


    let newX =
        player.x +
        input.x *
        speed;


    let newY =
        player.y +
        input.y *
        speed;


    /*
       World boundaries.
    */

    newX =
        Math.max(
            arenaBounds.left +
            player.radius,

            Math.min(
                arenaBounds.right -
                player.radius,

                newX
            )
        );


    newY =
        Math.max(
            arenaBounds.top +
            player.radius,

            Math.min(
                arenaBounds.bottom -
                player.radius,

                newY
            )
        );


    /*
       Tree collision.
    */

    if(
        !collidesWithTrees(
            newX,
            player.y,
            player.radius
        )
    ){

        player.x =
            newX;

    }


    if(
        !collidesWithTrees(
            player.x,
            newY,
            player.radius
        )
    ){

        player.y =
            newY;

    }


    /*
       Facing follows movement
       if there is no target.
    */

    if(
        input.x !== 0 ||
        input.y !== 0
    ){

        if(
            !getNearestTarget()
        ){

            player.facing =
                Math.atan2(
                    input.y,
                    input.x
                );

        }

    }

}


/* =====================================================
   TREE COLLISION
===================================================== */

function collidesWithTrees(
    x,
    y,
    radius
){

    for(
        const tree of trees
    ){

        const closestX =
            Math.max(
                tree.x,
                Math.min(
                    x,
                    tree.x +
                    tree.size
                )
            );


        const closestY =
            Math.max(
                tree.y,
                Math.min(
                    y,
                    tree.y +
                    tree.size
                )
            );


        const dx =
            x -
            closestX;

        const dy =
            y -
            closestY;


        if(
            dx * dx +
            dy * dy <
            radius * radius
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   BULLET COLLISION WITH TREES
===================================================== */

function bulletHitsTree(
    bullet
){

    for(
        const tree of trees
    ){

        if(

            bullet.x >
            tree.x &&

            bullet.x <
            tree.x +
            tree.size &&

            bullet.y >
            tree.y &&

            bullet.y <
            tree.y +
            tree.size

        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   CREATE PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount
){

    for(
        let i = 0;
        i < amount;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            1 +
            Math.random() *
            3;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                30 +
                Math.random() *
                30,

            size:
                2 +
                Math.random() *
                3

        });

    }

}


/* =====================================================
   UPDATE PARTICLES
===================================================== */

function updateParticles(
    delta
){

    for(
        let i =
            particles.length -
            1;

        i >= 0;

        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx *
            (delta / 16.67);


        p.y +=
            p.vy *
            (delta / 16.67);


        p.life -=
            delta / 16.67;


        p.vx *=
            .97;

        p.vy *=
            .97;


        if(
            p.life <=
            0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   UPDATE PLAYER BULLETS
===================================================== */

function updateBullets(
    delta
){

    for(
        let i =
            bullets.length -
            1;

        i >= 0;

        i--
    ){

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx *
            (delta / 16.67);


        bullet.y +=
            bullet.vy *
            (delta / 16.67);


        bullet.life -=
            delta / 16.67;


        /*
           Trees block bullets.
        */

        if(
            bulletHitsTree(
                bullet
            )
        ){

            createParticles(
                bullet.x,
                bullet.y,
                3
            );


            bullets.splice(
                i,
                1
            );

            continue;

        }


        /*
           Outside arena.
        */

        if(
            bullet.x <
            arenaBounds.left ||

            bullet.x >
            arenaBounds.right ||

            bullet.y <
            arenaBounds.top ||

            bullet.y >
            arenaBounds.bottom ||

            bullet.life <=
            0
        ){

            bullets.splice(
                i,
                1
            );

            continue;

        }


        /*
           Enemy collision.
        */

        let hit =
            false;


        for(
            const enemy of enemies
        ){

            if(
                enemy.dead
            ){

                continue;

            }


            if(
                distanceBetween(
                    bullet,
                    enemy
                ) <
                bullet.radius +
                enemy.radius
            ){

                enemy.hp -=
                    bullet.damage;

                enemy.hitFlash =
                    100;

                createParticles(
                    bullet.x,
                    bullet.y,
                    5
                );


                bullets.splice(
                    i,
                    1
                );


                hit =
                    true;


                if(
                    enemy.hp <=
                    0
                ){

                    killEnemy(
                        enemy
                    );

                }


                break;

            }

        }


        if(
            hit
        ){

            continue;

        }


        /*
           Clark collision.
        */

        if(
            clark &&
            !clark.dead
        ){

            if(
                distanceBetween(
                    bullet,
                    clark
                ) <
                bullet.radius +
                clark.radius
            ){

                clark.hp -=
                    bullet.damage;

                clark.hitFlash =
                    100;

                createParticles(
                    bullet.x,
                    bullet.y,
                    7
                );


                bullets.splice(
                    i,
                    1
                );


                if(
                    clark.hp <=
                    0
                ){

                    killClark();

                }

            }

        }

    }

}

function randomArenaPosition(){

    let position;

    let attempts =
        0;


    do{

        position = {

            x:
                arenaBounds.left +
                100 +
                Math.random() *
                (
                    arenaBounds.right -
                    arenaBounds.left -
                    200
                ),

            y:
                arenaBounds.top +
                100 +
                Math.random() *
                (
                    arenaBounds.bottom -
                    arenaBounds.top -
                    200
                )

        };


        attempts++;


    }while(

        (
            distanceBetween(
                position,
                player
            ) < 250

        ) &&

        attempts < 100

    );


    return position;

}

    }


    for(
        const enemy of enemies
    ){

        if(
            enemy.dead
        ){

            continue;

        }


        const distance =
            distanceBetween(
                enemy,
                player
            );


        const angle =
            angleBetween(
                enemy,
                player
            );


        /*
           Enemies only damage Sam
           when they get close.
        */

        if(
            distance >
            enemy.radius +
            player.radius +
            10
        ){

            let moveX =
                Math.cos(angle) *
                enemy.speed *
                (delta / 16.67);


            let moveY =
                Math.sin(angle) *
                enemy.speed *
                (delta / 16.67);


            /*
               Don't walk directly through trees.
            */

            const newX =
                enemy.x +
                moveX;

            const newY =
                enemy.y +
                moveY;


            if(
                !collidesWithTrees(
                    newX,
                    enemy.y,
                    enemy.radius
                )
            ){

                enemy.x =
                    newX;

            }


            if(
                !collidesWithTrees(
                    enemy.x,
                    newY,
                    enemy.radius
                )
            ){

                enemy.y =
                    newY;

            }

        }
        else{

            /*
               Close-range attack.
            */

            enemy.attackCooldown -=
                delta;


            if(
                enemy.attackCooldown <=
                0
            ){

                damagePlayer(
                    enemy.damage
                );


                enemy.attackCooldown =
                    900;

            }

        }


        /*
           Keep enemies inside arena.
        */

        enemy.x =
            Math.max(
                arenaBounds.left +
                enemy.radius,

                Math.min(
                    arenaBounds.right -
                    enemy.radius,

                    enemy.x
                )
            );


        enemy.y =
            Math.max(
                arenaBounds.top +
                enemy.radius,

                Math.min(
                    arenaBounds.bottom -
                    enemy.radius,

                    enemy.y
                )
            );

    }

}

){

    if(
        playerDead

        0
    ){

        return;

    }


    player.hp -=

    updateHealthUI();

    void canvas.offsetWidth;


    canvas.classList.add(

        updateHealthUI();

        killPlayer();

}

/* =====================================================
   CLARK UPDATE — FIXED INSIDE ARENA
===================================================== */

function updateClark(delta){

    if(
        !clark ||
        clark.dead ||
        gamePaused ||
        playerDead
    ){
        return;
    }


    const angle =
        angleBetween(
            clark,
            player
        );

    const distance =
        distanceBetween(
            clark,
            player
        );


    /* ---------------------------------------------
       CLARK MOVEMENT
    --------------------------------------------- */

    if(distance < 300){

        const moveX =
            -Math.cos(angle) *
            clark.speed *
            (delta / 16.67);

        const moveY =
            -Math.sin(angle) *
            clark.speed *
            (delta / 16.67);


        const newX =
            clark.x + moveX;

        const newY =
            clark.y + moveY;


        if(
            !collidesWithTrees(
                newX,
                clark.y,
                clark.radius
            )
        ){

            clark.x =
                newX;

        }


        if(
            !collidesWithTrees(
                clark.x,
                newY,
                clark.radius
            )
        ){

            clark.y =
                newY;

        }

    }


    /* ---------------------------------------------
       FORCE CLARK TO STAY INSIDE ARENA
    --------------------------------------------- */

    clark.x =
        Math.max(
            arenaBounds.left +
            clark.radius,

            Math.min(
                arenaBounds.right -
                clark.radius,

                clark.x
            )
        );


    clark.y =
        Math.max(
            arenaBounds.top +
            clark.radius,

            Math.min(
                arenaBounds.bottom -
                clark.radius,

                clark.y
            )
        );


    /* ---------------------------------------------
       ATTACK TIMERS
    --------------------------------------------- */

    clark.attackCooldown -=
        delta;

    clark.patternTimer -=
        delta;


    if(
        clark.patternTimer <= 0
    ){

        if(
            phase2Active
        ){

            clark.pattern =
                (
                    clark.pattern + 1
                ) % 4;

            clark.patternTimer =
                1800;

        }
        else{

            clark.pattern =
                (
                    clark.pattern + 1
                ) % 2;

            clark.patternTimer =
                2200;

        }

    }


    /* ---------------------------------------------
       ATTACK
    --------------------------------------------- */

    if(
        clark.attackCooldown <= 0
    ){

        if(
            phase2Active
        ){

            fireClarkPhase2();

        }
        else{

            fireClarkPhase1();

        }

    }

}


/* =====================================================
   CLARK PHASE 1 ATTACK
===================================================== */

function fireClarkPhase1(){

        !clark
    ){

        return;

    }

        );

                    ) * 4.5,

                        angle +

                    ) * 4.5,

                radius:8,

                damage:12,

                life:220

            });

        }

    }


    /*
       Pattern 1:
       Five spread bullets.
    */

    else{

        for(
            let i = -2;
            i <= 2;
            i++
        ){

            const spread =
                i * 0.2;


            enemyBullets.push({

                x:clark.x,

                y:clark.y,

                vx:
                    Math.cos(
                        angle +
                        spread
                    ) * 4,

                vy:
                    Math.sin(
                        angle +

                    ) * 4,

            });

        }

    }

}


/* =====================================================
   CLARK PHASE 2 ATTACKS
===================================================== */

function fireClarkPhase2(){

    if(
        !clark
    ){

        return;

    }


    const angle =
        angleBetween(
            clark,
            player
        );


    /*
       PATTERN 0
       Fast aimed burst.
    */

    if(
        clark.pattern ===
        0
    ){

        for(
            let i = 0;
            i < 3;
            i++
        ){

            setTimeout(
                () => {

                    if(
                        !clark ||
                        clark.dead
                    ){

                        return;

                    }


                    const currentAngle =
                        angleBetween(
                            clark,
                            player
                        );


                    enemyBullets.push({

                        x:
                            clark.x,

                        y:
                            clark.y,

                        vx:
                            Math.cos(
                                currentAngle
                            ) * 6,

                        vy:
                            Math.sin(
                                currentAngle
                            ) * 6,

                        radius:
                            8,

                        damage:
                            14,

                        life:
                            180

                    });

                },

                i * 180

            );

        }

    }


    /*
       PATTERN 1
       Circular attack.
    */

    else if(
        clark.pattern ===
        1
    ){

        const bulletsCount =
            12;


        for(
            let i = 0;
            i < bulletsCount;
            i++
        ){

            const a =
                (
                    Math.PI *
                    2 *
                    i
                ) /
                bulletsCount;


            enemyBullets.push({

                x:
                    clark.x,

                y:
                    clark.y,

                vx:
                    Math.cos(a) *
                    3.2,

                vy:
                    Math.sin(a) *
                    3.2,

                radius:
                    7,

                damage:
                    10,

                life:
                    230

            });

        }

    }


    /*
       PATTERN 2
       Wide fan.
    */

    else if(
        clark.pattern ===
        2
    ){

        for(
            let i = -4;
            i <= 4;
            i++
        ){

            const spread =
                i * 0.16;


            enemyBullets.push({

                x:
                    clark.x,

                y:
                    clark.y,

                vx:
                    Math.cos(
                        angle +
                        spread
                    ) * 4.5,

                vy:
                    Math.sin(
                        angle +
                        spread
                    ) * 4.5,

                radius:
                    7,

                damage:
                    11,

                life:
                    220

            });

        }

    }


    /*
       PATTERN 3
       Two diagonal waves.
    */

    else{

        const offsets = [

            -0.55,
            -0.3,
            0,
            0.3,
            0.55

        ];


        for(
            const offset of offsets
        ){

            enemyBullets.push({

                x:
                    clark.x,

                y:
                    clark.y,

                vx:
                    Math.cos(
                        angle +
                        offset
                    ) * 5,

                vy:
                    Math.sin(
                        angle +
                        offset
                    ) * 5,

                radius:
                    8,

                damage:
                    12,

                life:
                    200

            });

        }

    }


    clark.attackCooldown =
        phase2Active
            ? 650
            : 1100;

}


/* =====================================================
   UPDATE ENEMY BULLETS
===================================================== */

function updateEnemyBullets(
    delta
){

    for(
        let i =
            enemyBullets.length -
            1;

        i >= 0;

        i--
    ){

        const bullet =
            enemyBullets[i];


        bullet.x +=
            bullet.vx *
            (delta / 16.67);


        bullet.y +=
            bullet.vy *
            (delta / 16.67);


        bullet.life -=
            delta / 16.67;


        /*
           Trees block boss bullets.
        */

        if(
            bulletHitsTree(
                bullet
            )
        ){

            createParticles(
                bullet.x,
                bullet.y,
                3
            );


            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        /*
           Hit Sam.
        */

        if(
            distanceBetween(
                bullet,
                player
            ) <
            bullet.radius +
            player.radius
        ){

            damagePlayer(
                bullet.damage
            );


            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        /*
           Remove old bullets.
        */

        if(
            bullet.life <=
            0
        ){

            enemyBullets.splice(
                i,
                1
            );

        }

    }

}

/* =====================================================
   DRAW TREES
===================================================== */

function drawTrees(){

    for(
        const tree of trees
    ){

        const x =
            tree.x -
            camera.x;

        const y =
            tree.y -
            camera.y;


        /*
           Trunk
        */

        ctx.fillStyle =
            "#70452a";

        ctx.fillRect(

            x +
            tree.size * .36,

            y +
            tree.size * .48,

            tree.size * .28,

            tree.size * .52

        );


        /*
           Leaves
        */

        ctx.fillStyle =
            "#183f22";

        ctx.beginPath();

        ctx.arc(

            x +
            tree.size * .5,

            y +
            tree.size * .38,

            tree.size * .45,

            0,

            Math.PI * 2

        );

        ctx.fill();


        ctx.fillStyle =
            "#286332";

        ctx.beginPath();

        ctx.arc(

            x +
            tree.size * .35,

            y +
            tree.size * .35,

            tree.size * .25,

            0,

            Math.PI * 2

        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(

            x +
            tree.size * .65,

            y +
            tree.size * .30,

            tree.size * .27,

            0,

            Math.PI * 2

        );

        ctx.fill();

    }

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    const x =
        player.x -
        camera.x;

    const y =
        player.y -
        camera.y;


    /*
       If Sam's PNG exists,
       use the drawing.
    */

    if(
        images.sam.complete &&
        images.sam.naturalWidth > 0
    ){

        ctx.save();


        ctx.translate(
            x,
            y
        );


        /*
           Flip according to
           aiming direction.
        */

        if(
            Math.cos(
                player.facing
            ) < 0
        ){

            ctx.scale(
                -1,
                1
            );

        }


        const size =
            70;


        ctx.drawImage(

            images.sam,

            -size / 2,

            -size / 2,

            size,

            size

        );


        ctx.restore();

    }

    else{

        /*
           Temporary Sam
           while you haven't
           added sam.png.
        */

        ctx.fillStyle =
            "#4d9cff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            player.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
       Gun direction.
    */

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth =
        7;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(

        x +
        Math.cos(
            player.facing
        ) * 35,

        y +
        Math.sin(
            player.facing
        ) * 35

    );

    ctx.stroke();


    /*
       Invincibility blink.
    */

    if(
        player.invincible >
        0
    ){

        ctx.strokeStyle =
            "white";

        ctx.lineWidth =
            3;

        ctx.beginPath();

        ctx.arc(

            x,

            y,

            player.radius +
            6,

            0,

            Math.PI * 2

        );

        ctx.stroke();

    }

}

            image.complete &&
            image.naturalWidth > 0
        ){

/* =====================================================

===================================================== */

function drawHealthBar(
    x,
    y,
    width,
    height,
    percent
){

    percent =
        Math.max(
            0,
            Math.min(
                1,
                percent
            )
        );


    ctx.fillStyle =
        "rgba(0,0,0,.7)";


    ctx.fillRect(

        x -
        width / 2,

        y,

        width,

        height

    );


    ctx.fillStyle =
        "#e55353";


    ctx.fillRect(

        x -
        width / 2,

        y,

        width *
        percent,

        height

    );

}

/* =====================================================
   DRAW ENEMY BULLETS
===================================================== */

function drawEnemyBullets(){

    for(
        const bullet of enemyBullets
    ){

        const x =
            bullet.x -
            camera.x;

        const y =
            bullet.y -
            camera.y;


        ctx.fillStyle =
            phase2Active
                ? "#d27cff"
                : "#ff6464";


        ctx.beginPath();

        ctx.arc(

            x,

            y,

            bullet.radius,

            0,

            Math.PI * 2

        );

        ctx.fill();

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(
        const particle of particles
    ){

        const x =
            particle.x -
            camera.x;

        const y =
            particle.y -
            camera.y;


        ctx.globalAlpha =
            Math.max(
                0,
                particle.life /
                60
            );


        ctx.fillStyle =
            "#ffd36b";


        ctx.beginPath();

        ctx.arc(

            x,

            y,

            particle.size,

            0,

            Math.PI * 2

        );

        ctx.fill();

    }


    ctx.globalAlpha =
        1;

}


/* =====================================================
   DRAW ARENA GATE
===================================================== */

function drawGate(){

    /*
       The entrance closes after
       Sam enters the arena.

       Only visual here because
       the arena boundaries already
       prevent enemies from leaving.
    */

    const gateX =
        canvas.width / 2;


    const gateY =
        arenaBounds.bottom -
        camera.y;


    ctx.fillStyle =
        "rgba(20,20,20,.85)";


    ctx.fillRect(

        gateX -
        70,

        gateY -
        8,

        140,

        16

    );

}


/* =====================================================
   UPDATE CAMERA
===================================================== */

function updateCamera(){

    const targetX =
        player.x -
        canvas.width / 2;


    const targetY =
        player.y -
        canvas.height / 2;


    camera.x +=
        (
            targetX -
            camera.x
        ) *
        camera.smooth;


    camera.y +=
        (
            targetY -
            camera.y
        ) *
        camera.smooth;


    /*
       Keep camera inside arena.
    */

    camera.x =
        Math.max(
            0,

            Math.min(
                world.width -
                canvas.width,

                camera.x
            )
        );


    camera.y =
        Math.max(
            0,

            Math.min(
                world.height -
                canvas.height,

                camera.y
            )
        );

}


/* =====================================================
   UPDATE PLAYER INVINCIBILITY
===================================================== */

function updatePlayerTimers(
    delta
){

    if(
        player.invincible >
        0
    ){

        player.invincible -=
            delta;


        if(
            player.invincible <
            0
        ){

            player.invincible =
                0;

        }

    }


    if(
        weapon.fireCooldown >
        0
    ){

        weapon.fireCooldown -=
            delta;


        if(
            weapon.fireCooldown <
            0
        ){

            weapon.fireCooldown =
                0;

        }

    }

}


/* =====================================================
   MAIN UPDATE
===================================================== */

function update(
    delta
){

    if(
        !gameStarted
    ){

        return;

    }


    updatePlayerTimers(
        delta
    );


    updateReload(
        delta
    );


    if(
        !gamePaused
    ){

        movePlayer(
            delta
        );


        updateEnemies(
            delta
        );


        updateClark(
            delta
        );


        updateBullets(
            delta
        );


        updateEnemyBullets(
            delta
        );


        updateParticles(
            delta
        );


        if(
            shooting ||
            keyboard.shoot
        ){

            tryShoot();

        }


        if(
            currentArena <= 2
        ){

            checkArenaEnemies();

        }

    }
    else{

        /*
           Particles can still finish
           while dialogue is showing.
        */

        updateParticles(
            delta
        );

    }


    updateCamera();

}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw(){

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    drawArena();

    drawGate();

    drawTrees();

    drawBullets();

    drawEnemyBullets();

    drawEnemies();

    drawClark();

    drawPlayer();

    drawParticles();


    /*
       Boss HP display
    */

    if(
        clark &&
        !clark.dead
    ){

        /*
           Nothing extra needed here.
           The HP bar is above Clark.
        */

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
){

    const delta =
        Math.min(
            currentTime -
            lastTime,

            50
        );


    lastTime =
        currentTime;


    update(
        delta
    );


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =====================================================
   INITIAL SETUP
===================================================== */

generateTrees();

updateHealthUI();

updateAmmoUI();

===================================================== */
