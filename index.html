      <script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   IMAGE SYSTEM
===================================================== */

const images = {};

const imagePaths = {

    sam:
        "images/sam.png",

    elmer:
        "images/elmer.png",

    jobel:
        "images/jobel.png",

    clark:
        "images/clark.png",

    brent:
        "images/brent.png"

};


for(
    const key in imagePaths
){

    const img =
        new Image();

    img.src =
        imagePaths[key];

    images[key] =
        img;

}


function getCharacterImage(
    speaker
){

    const name =
        speaker.toLowerCase();


    if(
        name.includes("sam")
    )
        return images.sam;


    if(
        name.includes("elmer")
    )
        return images.elmer;


    if(
        name.includes("jobel")
    )
        return images.jobel;


    if(
        name.includes("clark")
    )
        return images.clark;


    if(
        name.includes("brent")
    )
        return images.brent;


    return images.sam;

}


/* =====================================================
   GAME STATE
===================================================== */

let gameStarted = false;

let gameEnded = false;

let playerDead = false;

let dialogueActive = false;

let currentArena = 1;

let arenaTransition = false;

let enemies = [];

let bullets = [];

let trees = [];

let particles = [];

let clark = null;

let brent = null;

let waveNumber = 0;


/* =====================================================
   WORLD
===================================================== */

const world = {

    width:1400,

    height:850

};


const camera = {

    x:0,

    y:0

};


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:700,

    y:720,

    radius:17,

    speed:3.6,

    hp:100,

    maxHp:100,

    ammo:5,

    maxAmmo:5,

    reloading:false,

    reloadStart:0,

    reloadDuration:2000,

    lastShot:0,

    shotCooldown:170

};


/* =====================================================
   INPUT
===================================================== */

const keys = {};

const mouse = {

    x:
        window.innerWidth/2,

    y:
        window.innerHeight/2,

    down:false

};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if(
            dialogueActive &&
            (
                event.key === " " ||
                event.key === "Enter"
            )
        ){

            advanceDialogue();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


canvas.addEventListener(
    "mousemove",
    event => {

        mouse.x =
            event.clientX;

        mouse.y =
            event.clientY;

    }
);


canvas.addEventListener(
    "mousedown",
    () => {

        if(dialogueActive){

            advanceDialogue();

        }
        else{

            mouse.down = true;

        }

    }
);


window.addEventListener(
    "mouseup",
    () => {

        mouse.down = false;

    }
);


/* =====================================================
   DIALOGUE CLICK
===================================================== */

document
    .getElementById(
        "dialogueScene"
    )
    .addEventListener(
        "click",
        () => {

            advanceDialogue();

        }
    );


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickActive = false;

let joystickX = 0;

let joystickY = 0;


joystick.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        joystickActive = true;

    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();


        if(!joystickActive)
            return;


        const touch =
            event.touches[0];


        const rect =
            joystick.getBoundingClientRect();


        let dx =
            touch.clientX -
            (
                rect.left +
                rect.width/2
            );


        let dy =
            touch.clientY -
            (
                rect.top +
                rect.height/2
            );


        const maxDistance =
            42;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if(
            distance >
            maxDistance
        ){

            dx =
                dx /
                distance *
                maxDistance;

            dy =
                dy /
                distance *
                maxDistance;

        }


        joystickX =
            dx /
            maxDistance;

        joystickY =
            dy /
            maxDistance;


        stick.style.transform =
            `translate(${dx}px,${dy}px)`;

    }
);


joystick.addEventListener(
    "touchend",
    () => {

        joystickActive = false;

        joystickX = 0;

        joystickY = 0;

        stick.style.transform =
            "translate(0,0)";

    }
);


/* =====================================================
   SHOOT BUTTON
===================================================== */

const shootButton =
    document.getElementById(
        "shootButton"
    );


shootButton.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();


        if(dialogueActive){

            advanceDialogue();

        }
        else{

            mouse.down = true;

        }

    }
);


shootButton.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        mouse.down = false;

    }
);


/* =====================================================
   MUSIC
===================================================== */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );

const bossMusic =
    document.getElementById(
        "bossMusic"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );


let musicEnabled = true;


bgMusic.volume =
    0.35;

bossMusic.volume =
    0.4;


function startNormalMusic(){

    if(!musicEnabled)
        return;


    bossMusic.pause();

    bossMusic.currentTime =
        0;


    bgMusic
        .play()
        .catch(
            () => {}
        );

}


function startBossMusic(){

    if(!musicEnabled)
        return;


    bgMusic.pause();


    bossMusic.currentTime =
        0;


    bossMusic
        .play()
        .catch(
            () => {}
        );

}


function stopMusic(){

    bgMusic.pause();

    bossMusic.pause();

}


musicButton.addEventListener(
    "click",
    () => {

        musicEnabled =
            !musicEnabled;


        if(
            musicEnabled
        ){

            musicButton.textContent =
                "♫";


            if(
                currentArena === 3
            ){

                startBossMusic();

            }
            else{

                startNormalMusic();

            }

        }
        else{

            musicButton.textContent =
                "OFF";


            stopMusic();

        }

    }
);
      /* =====================================================
   DIALOGUE DATA
===================================================== */

const dialogues = {

    arena1: [

        [
            "Sam",
            "Kailangan kong makuha ang turon ni clark"
        ],

        [
            "Sam",
            "Di niya ako pinatikim ng masarap niyang canton"
        ],

        [
            "Sam",
            "Kaya titikman ko ang turon niya ng may pwersa."
        ],

        [
            "Elmer",
            "turon ko ayaw mo?"
        ]

    ],


    arena2: [

        [
            "Sam",
            "Malapit nako,wag kang gagalaw clark"
        ],

        [
            "Jobel",
            "Ikaw galawin ko"
        ],

        [
            "Sam",
            "Awit"
        ]

    ],


    arena3: [

        [
            "Sam",
            "Andito nako"
        ],

        [
            "Sam",
            "Andito na ang halimaw"
        ],

        [
            "Clark",
            "Tsk, expected na kita boi"
        ],

        [
            "Sam",
            "bigay mona kasi turon mo"
        ],

        [
            "Clark",
            "Hard to get ako boss"
        ],

        [
            "Sam",
            "Lalabas kona ang aking 7 inches(shows a gun)"
        ],

        [
            "Clark",
            "putukan na"
        ]

    ],


    afterBoss: [

        [
            "Sam",
            "sarap"
        ],

        [
            "Sam",
            "ng nananalo"
        ],

        [
            "Clark",
            "eguls,3 inches lang akin"
        ]

    ],


    brent: [

        [
            "Brent",
            "Mas malaki tong akin boii"
        ]

    ]

};


/* =====================================================
   DIALOGUE VARIABLES
===================================================== */

let dialogueLines = [];

let dialogueIndex = 0;

let dialogueCallback = null;


/* =====================================================
   START DIALOGUE
===================================================== */

function startDialogue(
    lines,
    callback
){

    dialogueLines =
        lines;

    dialogueIndex =
        0;

    dialogueCallback =
        callback;

    dialogueActive =
        true;


    mouse.down =
        false;


    stopMusic();


    document
        .getElementById(
            "dialogueScene"
        )
        .style.display =
        "block";


    showDialogue();

}


/* =====================================================
   SHOW CURRENT DIALOGUE
===================================================== */

function showDialogue(){

    const line =
        dialogueLines[
            dialogueIndex
        ];


    const speaker =
        line[0];

    const text =
        line[1];


    document
        .getElementById(
            "speaker"
        )
        .textContent =
        speaker;


    document
        .getElementById(
            "dialogueText"
        )
        .textContent =
        text;


    const image =
        getCharacterImage(
            speaker
        );


    const imageElement =
        document
            .getElementById(
                "characterImage"
            );


    if(
        image &&
        image.complete &&
        image.naturalWidth > 0
    ){

        imageElement.src =
            image.src;

        imageElement.style.display =
            "block";

    }
    else{

        imageElement.removeAttribute(
            "src"
        );

        imageElement.style.display =
            "none";

    }

}


/* =====================================================
   NEXT DIALOGUE
===================================================== */

function advanceDialogue(){

    if(!dialogueActive)
        return;


    dialogueIndex++;


    if(
        dialogueIndex >=
        dialogueLines.length
    ){

        dialogueActive =
            false;


        document
            .getElementById(
                "dialogueScene"
            )
            .style.display =
            "none";


        const callback =
            dialogueCallback;


        dialogueCallback =
            null;


        if(callback){

            callback();

        }


        if(
            currentArena === 3 &&
            clark
        ){

            startBossMusic();

        }
        else{

            startNormalMusic();

        }


        return;

    }


    showDialogue();

}


/* =====================================================
   START BUTTON
===================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "startScreen"
                )
                .style.display =
                "none";


            gameStarted =
                true;


            startArena(1);

        }
    );
      /* =====================================================
   START ARENA
===================================================== */

function startArena(
    arenaNumber
){

    currentArena =
        arenaNumber;

    arenaTransition =
        false;


    enemies = [];

    bullets = [];

    particles = [];

    clark = null;

    brent = null;


    player.x =
        world.width/2;

    player.y =
        world.height - 100;


    player.ammo =
        player.maxAmmo;


    player.reloading =
        false;


    createArenaTrees(
        currentArena
    );


    document
        .getElementById(
            "arenaText"
        )
        .textContent =
        "ARENA " +
        currentArena;


    if(
        currentArena === 1
    ){

        startDialogue(
            dialogues.arena1,
            () => {

                beginWave(
                    "Elmer",
                    7
                );

            }
        );

    }


    else if(
        currentArena === 2
    ){

        startDialogue(
            dialogues.arena2,
            () => {

                beginWave(
                    "Jobel",
                    9
                );

            }
        );

    }


    else if(
        currentArena === 3
    ){

        startDialogue(
            dialogues.arena3,
            () => {

                startClark();

            }
        );

    }

}


/* =====================================================
   CREATE TREES
===================================================== */

function createArenaTrees(
    arena
){

    trees = [];


    const borderSize =
        55;


    /*
       Top border
    */

    for(
        let x=0;
        x<world.width;
        x+=75
    ){

        trees.push({

            x:x,

            y:0,

            width:60,

            height:borderSize

        });

    }


    /*
       Side borders
    */

    for(
        let y=80;
        y<world.height;
        y+=80
    ){

        trees.push({

            x:0,

            y:y,

            width:borderSize,

            height:65

        });


        trees.push({

            x:
                world.width -
                borderSize,

            y:y,

            width:borderSize,

            height:65

        });

    }


    const layouts = {

        1:[

            [180,150],
            [420,145],
            [750,155],
            [1080,180],

            [280,350],
            [650,330],
            [950,360],

            [170,550],
            [470,560],
            [820,540],
            [1120,570]

        ],


        2:[

            [150,140],
            [330,250],
            [550,140],
            [850,170],
            [1120,140],

            [220,430],
            [470,360],
            [700,470],
            [980,350],
            [1190,450],

            [350,620],
            [720,620],
            [1050,610]

        ],


        3:[

            [180,150],
            [500,130],
            [820,150],
            [1120,150],

            [170,370],
            [440,320],
            [700,430],
            [980,330],
            [1190,400],

            [300,620],
            [580,650],
            [900,620],
            [1130,630]

        ]

    };


    const layout =
        layouts[arena] ||
        layouts[1];


    for(
        const position of layout
    ){

        trees.push({

            x:position[0],

            y:position[1],

            width:65,

            height:80

        });

    }

}


/* =====================================================
   BEGIN WAVE
===================================================== */

function beginWave(
    type,
    amount
){

    waveNumber++;

    spawnEnemies(
        amount,
        type
    );

}


/* =====================================================
   SPAWN ENEMIES
===================================================== */

function spawnEnemies(
    amount,
    type
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const position =
            findSpawnPosition();


        enemies.push({

            type:type,

            x:position.x,

            y:position.y,

            radius:18,

            hp:45,

            maxHp:45,

            speed:
                1.15 +
                Math.random()*.25,

            attackCooldown:
                650,

            lastAttack:0,

            targetAngle:0,

            hitFlash:0

        });

    }

}


/* =====================================================
   FIND SPAWN POSITION
===================================================== */

function findSpawnPosition(){

    let best = null;

    let bestDistance = 0;


    for(
        let attempt=0;
        attempt<100;
        attempt++
    ){

        const x =
            100 +
            Math.random() *
            (
                world.width -
                200
            );


        const y =
            100 +
            Math.random() *
            (
                world.height -
                230
            );


        const distance =
            Math.hypot(
                x-player.x,
                y-player.y
            );


        if(
            distance <
            bestDistance
        ){

            continue;

        }


        const candidate = {

            x:x,

            y:y,

            radius:18

        };


        let blocked =
            false;


        for(
            const tree of trees
        ){

            if(
                circleRectCollision(
                    candidate,
                    tree
                )
            ){

                blocked =
                    true;

                break;

            }

        }


        if(!blocked){

            best =
                candidate;

            bestDistance =
                distance;

        }

    }


    return best || {

        x:100,

        y:100

    };

}
      /* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(){

    if(dialogueActive)
        return;


    let dx = 0;

    let dy = 0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        dy -= 1;

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        dy += 1;

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        dx -= 1;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        dx += 1;

    }


    if(
        joystickActive
    ){

        dx =
            joystickX;

        dy =
            joystickY;

    }


    const length =
        Math.hypot(
            dx,
            dy
        );


    if(length > 0){

        dx /= length;

        dy /= length;

    }


    moveCircle(
        player,

        dx *
        player.speed,

        dy *
        player.speed
    );

}


/* =====================================================
   CIRCLE MOVEMENT
===================================================== */

function moveCircle(
    object,
    moveX,
    moveY
){

    object.x += moveX;


    if(
        object.x <
        object.radius
    ){

        object.x =
            object.radius;

    }


    if(
        object.x >
        world.width -
        object.radius
    ){

        object.x =
            world.width -
            object.radius;

    }


    for(
        const tree of trees
    ){

        if(
            circleRectCollision(
                object,
                tree
            )
        ){

            if(
                moveX > 0
            ){

                object.x =
                    tree.x -
                    object.radius;

            }

            else if(
                moveX < 0
            ){

                object.x =
                    tree.x +
                    tree.width +
                    object.radius;

            }

        }

    }


    object.y += moveY;


    if(
        object.y <
        object.radius
    ){

        object.y =
            object.radius;

    }


    if(
        object.y >
        world.height -
        object.radius
    ){

        object.y =
            world.height -
            object.radius;

    }


    for(
        const tree of trees
    ){

        if(
            circleRectCollision(
                object,
                tree
            )
        ){

            if(
                moveY > 0
            ){

                object.y =
                    tree.y -
                    object.radius;

            }

            else if(
                moveY < 0
            ){

                object.y =
                    tree.y +
                    tree.height +
                    object.radius;

            }

        }

    }

}


/* =====================================================
   FIND NEAREST TARGET
===================================================== */

function getNearestTarget(){

    let closest = null;

    let closestDistance =
        Infinity;


    for(
        const enemy of enemies
    ){

        const distance =
            Math.hypot(
                enemy.x-player.x,
                enemy.y-player.y
            );


        if(
            distance <
            closestDistance
        ){

            closest =
                enemy;

            closestDistance =
                distance;

        }

    }


    if(clark){

        const distance =
            Math.hypot(
                clark.x-player.x,
                clark.y-player.y
            );


        if(
            distance <
            closestDistance
        ){

            closest =
                clark;

        }

    }


    return closest;

}

   SHOOTING

function updateShooting(){

    if(dialogueActive)
        return;


    if(player.reloading)
        return;


    if(!mouse.down)
        return;


    const now =
        Date.now();


    if(
        now -
        player.lastShot <
        player.shotCooldown
    ){

        return;

    }


    if(
        player.ammo <= 0
    ){

        startReload();

        return;

    }


    const target =
        getNearestTarget();


    if(!target)
        return;


    const angle =
        Math.atan2(
            target.y-player.y,
            target.x-player.x
        );


    bullets.push({

        x:player.x,

        y:player.y,

        vx:
            Math.cos(angle) *
            9,

        vy:
            Math.sin(angle) *
            9,

        radius:5,

        damage:20,

        enemyBullet:false

    });


    player.ammo--;

    player.lastShot =
        now;


    if(
        player.ammo <= 0
    ){

        startReload();

    }

}

/* =====================================================
   BULLETS
===================================================== */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;


        let remove =
            false;


        for(
            const tree of trees
        ){

            if(
                circleRectCollision(
                    bullet,
                    tree
                )
            ){

                remove =
                    true;

                break;

            }

        }


        if(
            bullet.x < 0 ||
            bullet.y < 0 ||
            bullet.x > world.width ||
            bullet.y > world.height
        ){

            remove =
                true;

        }


        /*
           Sam's bullets
        */

        if(
            !bullet.enemyBullet
        ){

            for(
                let j=enemies.length-1;
                j>=0;
                j--
            ){

                const enemy =
                    enemies[j];


                const distance =
                    Math.hypot(
                        bullet.x -
                        enemy.x,

                        bullet.y -
                        enemy.y
                    );


                if(
                    distance <
                    bullet.radius +
                    enemy.radius
                ){

                    enemy.hp -=
                        bullet.damage;


                    enemy.hitFlash =
                        6;


                    remove =
                        true;


                    if(
                        enemy.hp <= 0
                    ){

                        createParticles(
                            enemy.x,
                            enemy.y
                        );


                        enemies.splice(
                            j,
                            1
                        );

                    }


                    break;

                }

            }


            if(
                clark &&
                !remove
            ){

                const distance =
                    Math.hypot(
                        bullet.x -
                        clark.x,

                        bullet.y -
                        clark.y
                    );


                if(
                    distance <
                    bullet.radius +
                    clark.radius
                ){

                    clark.hp -=
                        bullet.damage;


                    clark.hitFlash =
                        6;


                    remove =
                        true;


                    if(
                        clark.hp <= 0
                    ){

                        defeatClark();

                    }

                }

            }

        }


        /*
           Clark bullets
        */

        if(
            bullet.enemyBullet
        ){

            const distance =
                Math.hypot(
                    bullet.x -
                    player.x,

                    bullet.y -
                    player.y
                );


            if(
                distance <
                bullet.radius +
                player.radius
            ){

                damagePlayer(
                    bullet.damage
                );


                remove =
                    true;

            }

        }


        if(remove){

            bullets.splice(
                i,
                1
            );

        }

    }

}
      /* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

    if(dialogueActive)
        return;


    for(
        const enemy of enemies
    ){

        if(
            enemy.hitFlash > 0
        ){

            enemy.hitFlash--;

        }


        const dx =
            player.x -
            enemy.x;

        const dy =
            player.y -
            enemy.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        enemy.targetAngle =
            Math.atan2(
                dy,
                dx
            );


        /*
           Attack when close
        */

        if(
            distance < 48
        ){

            const now =
                Date.now();


            if(
                now -
                enemy.lastAttack >
                enemy.attackCooldown
            ){

                damagePlayer(8);

                enemy.lastAttack =
                    now;

            }


            continue;

        }


        /*
           Chase Sam
        */

        let moveX =
            dx /
            Math.max(
                distance,
                1
            );


        let moveY =
            dy /
            Math.max(
                distance,
                1
            );


        /*
           Enemy separation
        */

        let separationX = 0;

        let separationY = 0;


        for(
            const other of enemies
        ){

            if(
                other === enemy
            )
                continue;


            const odx =
                enemy.x -
                other.x;


            const ody =
                enemy.y -
                other.y;


            const odistance =
                Math.hypot(
                    odx,
                    ody
                );


            if(
                odistance < 58 &&
                odistance > 0
            ){

                separationX +=
                    odx /
                    odistance;


                separationY +=
                    ody /
                    odistance;

            }

        }


        moveX +=
            separationX * .7;


        moveY +=
            separationY * .7;


        const length =
            Math.hypot(
                moveX,
                moveY
            );


        if(length > 0){

            moveX /=
                length;

            moveY /=
                length;

        }


        moveCircle(
            enemy,

            moveX *
            enemy.speed,

            moveY *
            enemy.speed
        );

    }

}

/* =====================================================
   CLARK AI
===================================================== */

function updateClark(){

    if(
        !clark ||
        dialogueActive
    )
        return;


    if(
        clark.hitFlash > 0
    ){

        clark.hitFlash--;

    }


    const now =
        Date.now();


    if(
        now -
        clark.lastAttack <
        clark.attackCooldown
    ){

        return;

    }


    clark.lastAttack =
        now;


    clark.pattern =
        Math.floor(
            Math.random()*4
        );


    /*
       Pattern 1:
       Three aimed shots
    */

    if(
        clark.pattern === 0
    ){

        const base =
            Math.atan2(
                player.y -
                clark.y,

                player.x -
                clark.x
            );


        for(
            let i=-1;
            i<=1;
            i++
        ){

            fireEnemyBullet(
                clark.x,
                clark.y,

                base +
                i*.16,

                4.4,

                12
            );

        }

    }


    /*
       Pattern 2:
       Circular attack
    */

    else if(
        clark.pattern === 1
    ){

        for(
            let i=0;
            i<10;
            i++
        ){

            const angle =
                Math.PI*2 *
                i/10;


            fireEnemyBullet(
                clark.x,
                clark.y,

                angle,

                3.3,

                10
            );

        }

    }


    /*
       Pattern 3:
       Fast aimed shot
    */

    else if(
        clark.pattern === 2
    ){

        const angle =
            Math.atan2(
                player.y -
                clark.y,

                player.x -
                clark.x
            );


        fireEnemyBullet(
            clark.x,
            clark.y,

            angle,

            5.5,

            16
        );

    }


    /*
       Pattern 4:
       Five-shot fan
    */

    else{

        const base =
            Math.atan2(
                player.y -
                clark.y,

                player.x -
                clark.x
            );


        for(
            let i=-2;
            i<=2;
            i++
        ){

            fireEnemyBullet(
                clark.x,
                clark.y,

                base +
                i*.20,

                4,

                11
            );

        }

    }

}

      /* =====================================================
   COLLISION
===================================================== */

function circleRectCollision(
    circle,
    rect
){

    const closestX =
        Math.max(
            rect.x,

            Math.min(
                circle.x,

                rect.x +
                rect.width
            )
        );


    const closestY =
        Math.max(
            rect.y,

            Math.min(
                circle.y,

                rect.y +
                rect.height
            )
        );


    const dx =
        circle.x -
        closestX;


    const dy =
        circle.y -
        closestY;


    return (
        dx*dx +
        dy*dy
    ) <
    circle.radius *
    circle.radius;

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y
){

    for(
        let i=0;
        i<8;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 3,

            vy:
                (
                    Math.random() -
                    .5
                ) * 3,

            life:25

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const particle =
            particles[i];


        particle.x +=
            particle.vx;


        particle.y +=
            particle.vy;


        particle.life--;


        if(
            particle.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}

            0,

            0,

            clark.radius,

            0,

            Math.PI*2

        );


        ctx.fill();

    }


    /*
       Boss HP
    */

    ctx.fillStyle =
        "#222";


    ctx.fillRect(

        -50,

        -65,

        100,

        8

    );


    ctx.fillStyle =
        "#e53935";


    ctx.fillRect(

        -50,

        -65,

        100 *
        Math.max(

            0,

            clark.hp /
            clark.maxHp

        ),

        8

    );


    ctx.restore();

}


/* =====================================================
   BRENT
===================================================== */

function drawBrent(){

    if(!brent)
        return;


    ctx.save();


    ctx.translate(

        brent.x -
        camera.x,

        brent.y -
        camera.y

    );


    const image =
        images.brent;


    if(

        image &&
        image.complete &&
        image.naturalWidth > 0

    ){

        ctx.drawImage(

            image,

            -45,

            -62,

            90,

            124

        );

    }
    else{

        ctx.fillStyle =
            "#c98b3d";


        ctx.beginPath();


        ctx.arc(

            0,

            0,

            30,

            0,

            Math.PI*2

        );


        ctx.fill();

    }


    ctx.restore();

}
      /* =====================================================
   DRAW BULLETS
===================================================== */

function drawBullets(){

    for(
        const bullet of bullets
    ){

        ctx.fillStyle =

            bullet.enemyBullet

            ? "#ff704f"

            : "#ffe66d";


        ctx.beginPath();


        ctx.arc(

            bullet.x -
            camera.x,

            bullet.y -
            camera.y,

            bullet.radius,

            0,

            Math.PI*2

        );


        ctx.fill();

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(
        const particle of particles
    ){

        ctx.fillStyle =
            "rgba(255,220,120,.8)";


        ctx.fillRect(

            particle.x -
            camera.x,

            particle.y -
            camera.y,

            4,

            4

        );

    }

}


/* =====================================================
   UI UPDATE
===================================================== */

function updateUI(){

    document
        .getElementById(
            "healthBar"
        )
        .style.width =

        (
            player.hp /
            player.maxHp *
            100

        ) + "%";


    document
        .getElementById(
            "ammo"
        )
        .textContent =

        player.reloading

        ? "RELOADING..."

        : "AMMO: " +
          player.ammo +
          " / 5";

}


/* =====================================================
   ARENA CLEAR
===================================================== */

function checkArenaClear(){

    if(

        dialogueActive ||
        arenaTransition ||
        currentArena === 3

    ){

        return;

    }


    if(
        enemies.length === 0
    ){

        arenaTransition =
            true;


        setTimeout(

            () => {

                startArena(
                    currentArena + 1
                );

            },

            1000

        );

    }

}


/* =====================================================
   DRAW EVERYTHING
===================================================== */

function draw(){

    drawGround();

    drawTrees();

    drawParticles();

    drawBullets();

    drawEnemies();

    drawClark();

    drawBrent();

    drawPlayer();

}


/* =====================================================
   UPDATE EVERYTHING
===================================================== */

function update(){

    if(

        !gameStarted ||
        gameEnded ||
        playerDead

    ){

        return;

    }


    /*
       Dialogue completely pauses
       the gameplay.
    */

    if(
        !dialogueActive
    ){

        updatePlayer();

        updateReload();

        updateShooting();

        updateBullets();

        updateEnemies();

        updateClark();

        updateParticles();

        checkArenaClear();

    }


    updateCamera();

    updateUI();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    update();

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =====================================================
   RESTART
===================================================== */

document
    .getElementById(
        "restart"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

</script>
